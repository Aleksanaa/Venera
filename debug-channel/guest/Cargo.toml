[package]
name = "venera-debug-guest"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
venera-debug-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Services",
  "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_Environment",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Etw",
  "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Globalization", "Win32_Devices_DeviceAndDriverInstallation",
] }
