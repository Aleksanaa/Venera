# SPDX-License-Identifier: MIT
# Builds everything the guest needs and packs it into the installer (venera-setup-<version>.exe), as README's build
# steps do, and puts it on a disc image (.iso) as well. A tag v<x.y.z> also publishes both as a release; the tag has to match the project's VERSION
# (CMakeLists.txt), to which the build appends the commit count and hash.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'tests/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'tests/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write  # the release

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/debug-channel
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the commit count is part of the version

      - uses: cachix/install-nix-action@v31

      - name: Configure the compiler cache
        run: echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Cache the WDK and SDK headers
        uses: actions/cache@v4
        with:
          path: refs/winkits
          key: winkits-${{ hashFiles('cmake/fetch-winkits.sh') }}

      - name: Fetch the WDK and SDK headers
        run: cmake/fetch-winkits.sh

      # Seed each commit with the newest compiler cache for this toolchain.
      - name: Cache the compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'cmake/*.cmake', 'cmake/fetch-winkits.sh', 'icd/build.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'cmake/*.cmake', 'cmake/fetch-winkits.sh', 'icd/build.sh') }}-
            ccache-

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('debug-channel/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: build/debug-channel
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('debug-channel/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('debug-channel/Cargo.lock') }}-
            cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}-

      - name: Prepare the dev shell
        run: nix develop -c ccache -z

      - name: Validate the protocol contract
        run: |
          nix develop -c cargo test --locked --manifest-path debug-channel/Cargo.toml -p venera-debug-protocol --features schema
          nix develop -c cargo run --locked --manifest-path debug-channel/Cargo.toml -p venera-debug-protocol --example generate-v1 --features schema -- --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate discovery schemas
        run: |
          python -m pip install jsonschema==4.25.1
          python debug-channel/protocol/tests/v1_schema.py

      - name: Cache the VirtIO serial release
        uses: actions/cache@v4
        with:
          path: build/vioserial-cache
          key: virtio-win-0.1.302-1

      - name: Fetch the VirtIO serial driver
        run: nix develop -c scripts/fetch-vioserial.sh

      - name: Build the Venus ICD and the OpenGL driver
        run: nix develop -c icd/build.sh

      # The kernel takes any signature in test mode: a throwaway certificate per build.
      - name: Build the KMD
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=Venera CI test signing" \
            -addext extendedKeyUsage=codeSigning -keyout "$RUNNER_TEMP/kmd.key" -out "$RUNNER_TEMP/kmd.crt"
          openssl pkcs12 -export -passout pass: -inkey "$RUNNER_TEMP/kmd.key" -in "$RUNNER_TEMP/kmd.crt" \
            -out "$RUNNER_TEMP/kmd.pfx"
          nix develop -c sh -c "cmake -S kmd -B build/kmd -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/clang-cl-kmd.cmake \
            -DVENERA_KMD_SIGN_PFX=$RUNNER_TEMP/kmd.pfx && ninja -C build/kmd"

      - name: Build the UMDs, the services and the installer
        run: |
          # A tag's build is a release build; any other a develop build.
          release=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          nix develop -c sh -c "cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake \
            -DVENERA_RELEASE=$release -DVENERA_VIOSERIAL_DIR=$PWD/build/vioserial/package && cmake --build build/win"
          version=$(cat build/win/setup/version.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp build/win/setup/venera-setup.exe "venera-setup-$version.exe"

      # The installer on a disc image, to attach to a VM as a CD-ROM. Joliet for the names Windows shows.
      - name: Wrap the installer in an ISO
        run: |
          nix develop -c xorriso -as mkisofs -J -joliet-long -R -V VENERA \
            -o "venera-setup-$VERSION.iso" "venera-setup-$VERSION.exe"

      - name: Compiler cache statistics
        if: always()
        run: nix develop -c ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: venera-setup-${{ env.VERSION }}
          path: |
            venera-setup-${{ env.VERSION }}.exe
            venera-setup-${{ env.VERSION }}.iso

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in "${GITHUB_REF_NAME#v}".*) ;; *)
            echo "Tag $GITHUB_REF_NAME does not match the version $VERSION"; exit 1 ;; esac
          # The notes are the body of the tagged commit's message (everything after the subject line).
          git log -1 --format=%b HEAD > notes.md
          gh release create "$GITHUB_REF_NAME" "venera-setup-$VERSION.exe" "venera-setup-$VERSION.iso" \
            --title "Venera $VERSION" --notes-file notes.md
